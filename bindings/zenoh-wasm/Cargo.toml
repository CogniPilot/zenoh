[package]
authors = ["ZettaScale Zenoh Team, <zenoh@zettascale.tech>"]
description = "Browser WebAssembly bindings for Zenoh over WebSocket transports."
edition = "2021"
license = "EPL-2.0 OR Apache-2.0"
name = "zenoh-wasm"
repository = "https://github.com/eclipse-zenoh/zenoh"
rust-version = "1.75.0"
version = "1.9.0-wasm.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "=0.1.7"
js-sys = "=0.3.94"
serde_json = "=1.0.145"
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "=0.4.67"
zenoh = { path = "../../zenoh", default-features = false, features = ["transport_ws"] }
